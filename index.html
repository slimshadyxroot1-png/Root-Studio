<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Root Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Root Studio</div>
  <button id="play">Play</button>
  <button id="stop">Stop</button>
  <label>BPM <input id="bpm" type="number" min="50" max="220" value="120"></label>
  <label>Swing <input id="swing" type="range" min="0" max="100" value="0"></label>
  <label>Master <input id="master" type="range" min="0" max="100" value="80"></label>
  <label>Delay <input id="delay" type="range" min="0" max="80" value="20"></label>
  <input id="title" type="text" value="Untitled" aria-label="Song name">
  <button id="save">Save</button>
  <button id="open">Open</button>
  <input id="file" type="file" accept=".json" hidden>
</header>

<div id="main">
  <aside id="presets"><h3>Presets</h3></aside>
  <section id="work">
    <div class="panel">
      <h2>Channel rack</h2>
      <div id="rack"></div>
    </div>
    <div class="panel">
      <h2>Piano roll
        <label>Wave <select id="wave">
          <option value="sawtooth">Saw</option><option value="square">Square</option>
          <option value="triangle">Triangle</option><option value="sine">Sine</option></select></label>
        <label>Key <select id="root"></select></label>
        <label><select id="scale"></select></label>
        <label>Note length <select id="len">
          <option value="1">1/16</option><option value="2">1/8</option>
          <option value="4">1/4</option><option value="8">1/2</option></select></label>
      </h2>
      <div id="roll"><div id="keys"></div><div id="grid"></div></div>
    </div>
  </section>
</div>

<footer id="status">Click the squares to write a drum pattern, then press Play.</footer>

<script src="app.js"></script>
</body>
</html>
